# alint layer fragment — the tool's prek hook (merged into the project's
# prek.toml by the CLI; apt-22: per-tool fragments, applied in the CLI's
# declared order).
#:schema https://www.schemastore.org/prek.json

# No generic builtin hooks here: alint owns trailing whitespace, final
# newlines, and merge markers (spec: Enforcement — checkers do not overlap).
# Language linters for code come from the base template, not from this layer.

# Official mirror supplies a prebuilt hook binary. The mise-managed CLI
# remains available for `mise run check` and `alint lsp`.
[[repos]]
repo = "https://github.com/asamarts/alint-pre-commit"
rev = "v0.22.0"

[[repos.hooks]]
id = "alint"

# Refresh generated instructions only when their owning rules change.
[[repos]]
repo = "local"

[[repos.hooks]]
id = "alint-agents-md"
name = "alint AGENTS.md"
entry = "alint export-agents-md --inline --output AGENTS.md"
language = "system"
pass_filenames = false
always_run = true
files = '^\\.alint\\.yml$'
