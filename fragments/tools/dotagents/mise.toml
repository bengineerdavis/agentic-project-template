# dotagents layer fragment — merged into the project's mise.toml by the CLI
# (apt-22: per-tool fragments, applied in the CLI's declared order).
#
# Backend verified by ls-remote (2026-10-18): npm: scoped key. The bare name
# resolves nothing in the mise registry and breaks config parsing in every
# stamped project.

[tools]
"npm:@sentry/dotagents" = "latest"

[tasks.dotagents-add]
description = "Refresh reviewed external dependency catalogs and project them"
# Make the reviewed shared workflow source an explicit, repeatable dependency
# refresh. `install` only consumes the resolved state; native marketplace
# registration for other clients stays in the dotfiles client installer.
run = '''
# Add requires project-scoped trust; later projection also reads user-scoped
# trust. `trust add` rejects an already-trusted source, so check each scope.
# Only these reviewed sources are trusted; other installer failures still stop.
for source in mattpocock/skills bengineerdavis/ai-prompt-library; do
  grep -Fq "\"$source\"" agents.toml ||
    dotagents --project trust add "$source"
  grep -Fq "\"$source\"" "${DOTAGENTS_HOME:-$HOME/.agents}/agents.toml" ||
    dotagents --user trust add "$source"
done
dotagents --project add mattpocock/skills --all
dotagents --project install
'''

[tasks.dotagents-install]
description = "Install dependencies already declared in project agents.toml"
# Intentionally no implicit source refresh: this is the pure install path.
run = "dotagents --project install"
