# Development harness for THIS repository (the template itself).
# A stamped project gets a different, generated mise fragment.

#:schema https://mise.jdx.dev/schema/mise.json

[tools]
uv = "latest"
python = "3.12"
prek = "0.5.2"
tombi = "1.5.5"
copier = "9.18.2"
worktrunk = { version = "0.80.0", workflow = "release.yaml" }
# TODO(bdavis): pin roborev once its mise backend is probed
# (mise ls-remote <backend>:<repo>; registry > aqua: > github:, ubi removed 2027.1.0)

# opencode V2 ships from opencode.ai, not GitHub releases — the registry's
# aqua backend 404s on V2 tags, and its 1.x line cannot parse a V2 global
# config (apt-21). Bump = `version` + all four URLs + all four checksums
# together (checksums mirror the anomalyco/tap opencode-v2 brew formula).
[tools."http:opencode"]
version = "2.0.32"

[tools."http:opencode".platforms.linux-x64]
url = "https://opencode.ai/files/bin/2.0.32/opencode-linux-x64-baseline.tar.gz"
checksum = "sha256:8adfbefe1d697b5d1774ab8d31630303543aa0676b9aa15d94ceb8e80a5bff69"

[tools."http:opencode".platforms.linux-arm64]
url = "https://opencode.ai/files/bin/2.0.32/opencode-linux-arm64.tar.gz"
checksum = "sha256:c2e4f6c94f2e58a2df99cc9647bd37285569600d7435e3796152825d8c9d10382"

[tools."http:opencode".platforms.macos-x64]
url = "https://opencode.ai/files/bin/2.0.32/opencode-darwin-x64-baseline.zip"
checksum = "sha256:25f788c18d46664d6aac8983c1a412ec169d3ff87f754e93f5026b6d1d03da6b"

[tools."http:opencode".platforms.macos-arm64]
url = "https://opencode.ai/files/bin/2.0.32/opencode-darwin-arm64.zip"
checksum = "sha256:e431e369025ba9554445d0ea8ad65457fbca59aa385ca790724ec6ab488d271b"

[bootstrap.packages]
"apt:git" = { os = "linux" }
"apt:curl" = { os = "linux" }
"brew:git" = { os = "macos" }
"brew:curl" = { os = "macos" }

[vars]
# Stamp-matrix scratch lives in user space, not shared /tmp: /tmp never
# self-clears on root-fs machines and shared-tmp dirs are subject to the
# root-owned-hazard class (apt-18/19). TEMPLATE_STAMP_ROOT still overrides.
stamp_root = "$HOME/.cache/agentic-project-template/stamp-matrix"

[tasks.install]
description = "Bootstrap tools, venv, and hooks"
run = '''
#!/usr/bin/env bash
set -euo pipefail
: "${TMPDIR:=/tmp}"
if [ -d "$TMPDIR/fslock" ] && [ ! -w "$TMPDIR/fslock" ]; then
  echo "ERROR: $TMPDIR/fslock is not writable by $(whoami) — aube (mise npm backend) will fail to lock." >&2
  echo "  fix: sudo chown -R \"$(id -un):$(id -gn)\" \"$TMPDIR/fslock\"   # or: export TMPDIR=<user-owned dir>" >&2
  exit 1
fi
mise install prek tombi copier "http:opencode" || true
uv sync --all-groups
uv run prek install --force 2>/dev/null || prek install --force
'''

[tasks.test]
description = "Unit tests (merge logic)"
run = "uv run pytest tests/ -x -q"

[tasks.test-template]
description = "Stamp matrix: layer-only, with-base, existing merge, update"
run = '''
#!/usr/bin/env bash
set -euo pipefail
root="${TEMPLATE_STAMP_ROOT:-{{ vars.stamp_root }}}"
rm -rf "$root" && mkdir -p "$root"
uv run agentic-project-template layer "$root/existing" --non-interactive
uv run agentic-project-template new "$root/fresh" --base "$PWD" --non-interactive
if git rev-parse -q --verify HEAD >/dev/null 2>&1; then
  dst="$root/updating"
  uv run agentic-project-template layer "$dst" --non-interactive \
    --set include_git_ai=true
  git -C "$dst" init -q && git -C "$dst" add -A
  git -C "$dst" -c user.email=fixture@local -c user.name=fixture commit -qm fixture
  uv run agentic-project-template update "$dst"
  grep -q "include_git_ai: true" "$dst/.agentic-answers.yml"
  echo "update smoke OK (choices preserved)"
else
  echo "update smoke skipped: template repo has no commits yet"
fi
echo "stamp matrix OK: $root"
'''

[tasks.lint]
description = "prek hooks on all files (tombi formats all *.toml)"
run = "uv run prek run --all-files"
