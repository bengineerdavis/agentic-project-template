# agentic-project-template layer fragment — merged into the project's
# mise.toml by the CLI. Keep minimal and conventionally shaped so aboyeur
# and `mise doctor project` can extend it (spec: Boundary — stamped mise.toml
# stays extendable). Never put personal or machine-specific values here.
#
# apt-22: this fragment carries ONLY the layer-composition tasks — the
# bootstrap install and the check gate. Every tool's [tools] pin and
# tool-specific task lives in fragments/tools/<tool>/mise.toml and is
# merged after this fragment, in the CLI's declared order.

#:schema https://mise.jdx.dev/schema/mise.json

[tasks.install]
description = "Bootstrap agentic layer: tools, managed state, hooks"
run = '''
#!/usr/bin/env bash
set -euo pipefail
: "${TMPDIR:=/tmp}"
if [ -d "$TMPDIR/fslock" ] && [ ! -w "$TMPDIR/fslock" ]; then
  echo "ERROR: $TMPDIR/fslock is not writable by $(whoami) — aube (mise npm backend) will fail to lock." >&2
  echo "  fix: sudo chown -R \"$(id -un):$(id -gn)\" \"$TMPDIR/fslock\"   # or: export TMPDIR=<user-owned dir>" >&2
  exit 1
fi
mise install prek tombi "http:opencode" "github:asamarts/alint" "npm:pyright"
mise install "npm:@sentry/dotagents"
mise run dotagents-add
dotagents --project install
prek install --force
mise install "github:kenn-io/roborev" >/dev/null 2>&1 || echo "warn: roborev install failed (github:kenn-io/roborev — continuing without it)" >&2
if command -v roborev >/dev/null 2>&1; then
  if ! roborev init; then
    echo "warn: roborev init failed (no git repo yet, or daemon unavailable)" >&2
  fi
else
  echo "warn: roborev init skipped (binary absent — install failed this run or is not on PATH)" >&2
fi
mise run backlog-init
'''

[tasks.check]
description = "Structure enforcement: alint + tombi lint"
run = '''
#!/usr/bin/env bash
set -euo pipefail
alint check
tombi lint mise.toml
'''
