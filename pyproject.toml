[project]
name = "agentic-project-template"
version = "0.1.0"
description = "Copier template + CLI that add an agentic layer to any project"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE*"]
dependencies = [
  "copier>=9.18",
  "pyyaml>=6.0",
  "tomli-w>=1.2",
  "typer>=0.12",
]

[project.scripts]
agentic-project-template = "agentic_project_template.cli:app"

[dependency-groups]
dev = [
  "backlog-md-py>=2.1.0",
  "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentic_project_template"]

[tool.hatch.build.targets.wheel.force-include]
"copier.yml" = "agentic_project_template/copier.yml"
"template" = "agentic_project_template/template"
"fragments" = "agentic_project_template/fragments"

[tool.pytest.ini_options]
testpaths = ["tests"]
